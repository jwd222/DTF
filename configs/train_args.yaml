model: yolo26s.pt
data: configs/data.yaml

epochs: 300
imgsz: 960
batch: 2

optimizer: MuSGD
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

box: 7.5
cls: 2.0
dfl: 1.5
fl_gamma: 2.0

copy_paste: 0.0
degrees: 3.0
translate: 0.1
scale: 0.3
fliplr: 0.5

mosaic: 1.0
mixup: 0.0
close_mosaic: 10

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

patience: 80
save_period: 10
workers: 4
project: runs/train
name: yolo26_vehicle

device: 0
seed: 42
deterministic: false
amp: true
cache: false
