[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-traffic"
version = "0.1.0"
description = "Multi-camera traffic monitoring system with drone video streams"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "lapx>=0.5.9",
    "filterpy>=1.4.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyzmq>=26.0",
    "msgpack>=1.0",
    "protobuf>=5.0",
    "ultralytics>=8.3.0",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.18",
    "motmetrics>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
train = [
    "ultralytics>=8.3.0",
]
reid = [
    "onnxruntime-gpu>=1.18",
    "torchreid>=0.2.5",
]
tensorrt = [
    "tensorrt>=10.0",
]

[project.scripts]
drone-traffic = "drone_traffic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
